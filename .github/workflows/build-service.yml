name: Build service

on:
  push:
    tags: ['**']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build service
        run: bun run build:service

      - name: Package service
        run: tar -czf karabiner-service-macos-arm64.tar.gz -C dist karabiner-service

      - name: Upload service
        uses: actions/upload-artifact@v7
        with:
          path: karabiner-service-macos-arm64.tar.gz
          archive: false
          if-no-files-found: error
