name: Build client

on:
  push:
    tags: ['**']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      # Xcode 16.4 includes the Metal tools required by GPUI.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchains
        run: |
          rustup show
          xcrun --sdk macosx --find metal
          xcrun --sdk macosx --find metallib

      - name: Build client
        run: cargo build -p karabiner-client --release --locked

      - name: Package client
        run: tar -czf karabiner-client-macos-arm64.tar.gz -C target/release karabiner

      - name: Upload client
        uses: actions/upload-artifact@v7
        with:
          path: karabiner-client-macos-arm64.tar.gz
          archive: false
          if-no-files-found: error
