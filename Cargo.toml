[workspace]
resolver = "2"
members = ["apps/client", "crates/protocol"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
# gpui-kit 0.11.0 pins GPUI to the gpui-pre =0.3.14 snapshot; keep the HTTP client on the same snapshot.
gpui-kit = { version = "=0.11.0" }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.14" }
protocol = { path = "crates/protocol", package = "karabiner-protocol" }
anyhow = "1"
futures = "0.3"
log = "0.4"
rust-embed = "8.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already resolved through gpui-kit (its calendar uses it); used directly for local civil dates.
jiff = "1.0"
